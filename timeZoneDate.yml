---
- name: Change time and date configuration
  hosts: inventory_Group
  gather_facts: no
  tasks:
    - name: Get lockout status
      ansible.builtin.uri:
        url: "http://{{ inventory_hostname }}/cgi-bin/api-get_lockout"
        method: GET
        headers:
          Referer: "http://{{ inventory_hostname }}/"
        return_content: true
      register: lockout_status

    - name: Perform login
      ansible.builtin.uri:
        url: "http://{{ inventory_hostname }}/cgi-bin/dologin"
        method: POST
        headers:
          Referer: "http://{{ inventory_hostname }}/"
        body_format: form-urlencoded
        body:
          username: "user_api_http"
          password: "password"
        return_content: true
      register: login_result

    - name: Debug login result
      ansible.builtin.debug:
        var: login_result

    - name: Check account status after login
      ansible.builtin.uri:
        url: "http://{{ inventory_hostname }}/json/contents/status_account.js"
        method: GET
        headers:
          Cookie: "session-identity={{ login_result.json.body.sid }}; session-role=admin"
        return_content: true
      register: account_status

    - name: Debug account status
      ansible.builtin.debug:
        var: account_status

    - name: Change time and date configuration
      ansible.builtin.uri:
        url: "http://{{ inventory_hostname }}/cgi-bin/api.values.post"
        method: POST
        headers:
          Cookie: "session-identity={{ login_result.json.body.sid }}; session-role=admin"
          Referer: "http://{{ inventory_hostname }}/"
        body_format: form-urlencoded
        body:
          P64: "MST7MDT,M4.1.0,M10.5.0"
          sid: "{{ login_result.json.body.sid }}"
        return_content: true
      register: config_result

    - name: Debug config result
      ansible.builtin.debug:
        var: config_result
